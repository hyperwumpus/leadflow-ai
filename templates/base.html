<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">{{ app_name }}</a>
  <nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('intake') }}">Lead Form</a></nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
